spring.application.name=Trinity Clinic Manager
application.version=@project.version@
spring.banner.location=classpath:banner.txt

server.servlet.context-path=/trinity
server.port=8080


############################################### APP PROPERTIES #########################################################
team.name= IT Solutions Services
app.services.url=https://www.clinic-trinity.com

############################################### LOGS CONFIG ############################################################
logging.file.path=logs/
logging.file.name=logs/trinity-services.log
logging.level.root=INFO
logging.level.org.flywaydb=DEBUG
logging.level.it.solutions.services.trinity.core=INFO
logging.level.it.solutions.services.trinity=TRACE
logging.level.org.springframework.ws=TRACE
logging.level.org.springframework.security=WARN
#logging.level.org.springdoc=DEBUG
#logging.level.io.swagger=DEBUG

############################################### DATABASE CONFIG  AND HIBERNATE DATASOURCE CONFIGURATION ################
# ??? Datasource complète ??????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/trinity_db?currentSchema=clinic
spring.datasource.username=trinity
spring.datasource.password=${DB_PASSWORD:1rinity@clinik3}

# ??? HikariCP ?????????????????????????????????????????????
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ??? JPA / Hibernate ??????????????????????????????????????
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=clinic


############################################### FLYWAY CONFIGURATION ################
spring.flyway.schemas=clinic
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

############################################### JWT CONFIGURATION ################
app.jwt.secret=${JWT_SECRET:cliqueSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm}
app.jwt.access.expiration=86400000
app.jwt.refresh.expiration=87400000




management.health.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:clinique@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

app.uploads.path=/var/clinique/uploads
app.sms.api-key=${SMS_API_KEY:}
app.sms.sender=Clinique






############################################### SPRING DOC -SWAGGER ###################################################
springdoc.packages-to-scan=it.solutions.services.trinity.services.controllers,it.solutions.services.trinity.patient.controller,it.solutions.services.trinity.employe.controller
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/trinity/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/trinity/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


############################################### SPRING SECURITY ###################################################
web.config.origins.allowed=http://localhost:8084
