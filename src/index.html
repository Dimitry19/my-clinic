<!doctype html>
<html lang="fr">
  <head>
    <!-- ═══════════════════════════════════════════════════════════
     META TAGS — Centre Médical la Trinité
     À placer dans <head> de src/index.html
     ═══════════════════════════════════════════════════════════ -->

    <!-- ── Encodage & Viewport ── -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO essentiels ── -->
    <title>Centre Médical la Trinité — Système de gestion médicale</title>
    <base href="/" />
    <meta
      name="description"
      content="Gérez efficacement votre clinique avec le système intégré du Centre Médical la Trinité : dossiers patients, rendez-vous, laboratoire, pharmacie, ressources humaines et facturation."
    />
    <meta
      name="keywords"
      content="clinique, médecin, patient, dossier médical, rendez-vous, laboratoire, pharmacie, gestion clinique, Centre Médical la Trinité, santé, consultation"
    />
    <meta name="author" content="IT Solutions Services" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Thème & couleur navigateur ── -->
    <meta name="theme-color" content="#185FA5" />
    <meta name="msapplication-TileColor" content="#185FA5" />

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Centre Médical la Trinité" />
    <meta
      property="og:title"
      content="Centre Médical la Trinité — Gestion médicale intégrée"
    />
    <meta
      property="og:description"
      content="Système de gestion médicale du Centre Médical la Trinité : patients, rendez-vous, laboratoire, pharmacie, RH et facturation en un seul outil."
    />
    <meta property="og:url" content="https://clinique-trinite.vercel.app" />
    <meta
      property="og:image"
      content="https://clinique-trinite.vercel.app/assets/images/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="article:publisher"
      content="https://www.facebook.com/centremeditrinite"
    />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Centre Médical la Trinité — Gestion médicale intégrée"
    />
    <meta
      name="twitter:description"
      content="Système de gestion médicale du Centre Médical la Trinité : patients, rendez-vous, laboratoire, pharmacie, RH et facturation."
    />
    <meta
      name="twitter:image"
      content="https://clinique-trinite.vercel.app/assets/images/og-image.png"
    />

    <!-- ── Performance : preconnect ── -->
    <link rel="preconnect" href="https://ton-backend.railway.app" />
    <link rel="dns-prefetch" href="https://ton-backend.railway.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── PWA ── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trinité Clinique" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ── Favicons ── -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#185FA5" />
  </head>
  <body>
    <clnt-root></clnt-root>
  </body>
</html>
